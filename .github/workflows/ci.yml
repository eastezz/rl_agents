name: CI
 
# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:
 
# The workflow only needs to read the code.
permissions:
  contents: read
 
jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
 
      - name: Install the package with the test tools
        run: pip install -e ".[dev]"
 
      - name: Lint with ruff
        run: ruff check .
 
      - name: Run tests
        run: pytest -v