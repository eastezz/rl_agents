[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-agents"
version = "0.1.0"
description = "Reinforcement learning agents written from scratch"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
